name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate plugin manifests
        run: node scripts/validate.mjs
      - name: Syntax-check the bundled bin
        run: node --check bin/librarian-conv-state-inject.js
      - name: Smoke-test the conv-state injection bin
        run: node scripts/smoke.mjs
