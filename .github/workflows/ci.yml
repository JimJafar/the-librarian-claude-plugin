name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate plugin manifests
        run: node scripts/validate.mjs
      - name: Syntax-check the bundled bin
        run: node --check bin/librarian-conv-state-inject.js
      - name: Smoke-test the conv-state injection bin
        run: node scripts/smoke.mjs

  release-guard:
    name: Release hygiene (version bump + no [Unreleased])
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Every PR must bump the version (package.json + both .claude-plugin
      # manifests) and file a dated CHANGELOG entry — no `[Unreleased]`. On a PR
      # we hand the guard the base-main version so it can prove the bump happened.
      - name: Check release hygiene
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --depth=1 origin main
            RELEASE_BASE_VERSION="$(git show origin/main:package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")"
            export RELEASE_BASE_VERSION
            echo "Base (origin/main) version: $RELEASE_BASE_VERSION"
          fi
          node scripts/check-release.mjs
